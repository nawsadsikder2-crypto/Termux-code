<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Those You Need</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#f5f5ff;font-family:Arial}
header{padding:20px;background:#121725;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #343047}
.logo{font-size:21px;font-weight:bold;color:#b99aff}
button{border:0;padding:12px 16px;border-radius:9px;font-weight:bold;cursor:pointer}
.btn{background:linear-gradient(90deg,#a78bfa,#5eead4);color:#10111a}
.dark{background:#242b3d;color:white}
.hero{padding:65px 22px;background:linear-gradient(130deg,#211b3b,#102c34);text-align:center}
.hero h1{font-size:38px;margin:10px}
.hero p{color:#c3c7d8;line-height:1.6}
main{max-width:1000px;margin:auto;padding:22px}
h2{margin-top:28px}
#search,input,textarea{width:100%;padding:13px;background:#151d2b;color:white;border:1px solid #343d50;border-radius:9px;margin:7px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-top:18px}
.card{background:#151d2b;border:1px solid #30394d;border-radius:14px;overflow:hidden}
.card img{width:100%;height:160px;object-fit:cover}
.info{padding:14px}
.price{color:#5eead4;font-weight:bold}
footer{text-align:center;padding:30px;color:#999;border-top:1px solid #333;margin-top:40px}
</style>
</head>
<body>
<header>
<div class="logo">THOSE YOU NEED</div>
<button class="dark" onclick="admin()">Admin</button>
</header>

<section class="hero">
<h1>Everything You Need.</h1>
<p>Discover useful products for your everyday life.</p>
<button class="btn" onclick="document.getElementById('products').scrollIntoView()">Explore Products</button>
</section>

<main>
<h2 id="products">Our Products</h2>
<input id="search" placeholder="Search products..." oninput="showProducts()">
<div class="grid" id="list"></div>
</main>

<footer>
<strong>THOSE YOU NEED</strong><br>
WhatsApp Order | Cash on Delivery
</footer>

<script>
const whatsapp="8801739237204";
let products=JSON.parse(localStorage.getItem("products")||"[]");

function save(){localStorage.setItem("products",JSON.stringify(products))}
function showProducts(){
let q=document.getElementById("search").value.toLowerCase();
let list=document.getElementById("list");
list.innerHTML="";
products.filter(p=>p.name.toLowerCase().includes(q)).forEach((p,i)=>{
list.innerHTML+=`
<div class="card">
${p.image?`<img src="${p.image}">`:""}
<div class="info">
<h3>${p.name}</h3>
<p>${p.desc||""}</p>
<p class="price">৳${p.price}</p>
<button class="btn" onclick="order(${i})">Order Now</button>
</div></div>`;
});
if(!list.innerHTML)list.innerHTML="<p>No products available yet.</p>";
}
function order(i){
let p=products[i];
let msg=`Hello, I want to order ${p.name}. Price: ৳${p.price}. Payment: Cash on Delivery.`;
window.open("https://wa.me/"+whatsapp+"?text="+encodeURIComponent(msg));
}
function admin(){
let pin=prompt("Enter admin PIN");
if(pin!=="2468"){alert("Wrong PIN");return}
let action=prompt("Type ADD, EDIT or DELETE");
if(action==="ADD"){
let name=prompt("Product name");
let price=prompt("Price");
let image=prompt("Image URL (optional)")||"";
let desc=prompt("Description")||"";
if(name&&price){products.push({name,price,image,desc});save();showProducts()}
}else if(action==="DELETE"){
let n=Number(prompt("Product number to delete (1, 2, 3...)"));
if(n>0&&n<=products.length){products.splice(n-1,1);save();showProducts()}
}else if(action==="EDIT"){
let n=Number(prompt("Product number to edit"));
if(n>0&&n<=products.length){
let p=products[n-1];
p.name=prompt("New name",p.name)||p.name;
p.price=prompt("New price",p.price)||p.price;
save();showProducts();
}
}
}
showProducts();
</script>
</body>
</html>
